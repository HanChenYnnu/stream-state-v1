dataset:
  root: "/public/home/USERNAME/datasets/DAiSEE"
  manifest_csv: "data/interim/daisee_manifest.csv"

sampling:
  num_frames: 16
  image_size: 160

feature_export:
  enable: true
  out_dir: "data/interim/daisee_proxy_features"
  out_manifest_csv: "data/interim/daisee_manifest_with_features.csv"

model:
  model_type: "temporal_proxy" # frame_baseline | temporal_proxy | lightweight_fusion

train:
  lr: 0.0005
  weight_decay: 0.0001
  epochs: 10
  batch_size: 8
  num_workers: 4
  mixed_precision: false

eval:
  split: "test"
  batch_size: 8
  num_workers: 2

output:
  run_dir: "results/daisee/train_run"
  eval_dir: "results/daisee/eval_run"

seed: 42
